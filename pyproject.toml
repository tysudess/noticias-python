[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-de-noticias"
version = "0.0.1"
description = "Fundação da migração controlada do Monitor de Notícias para Python"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.9.1",
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
