name: Build e Release Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "resources/**"
      - "portable/**"
      - "tools/news_extractor/**"
      - "tools/spreadsheet_automation/**"
      - "tools/globoplay-login-helper.py"
      - "tools/build-globoplay-login-helper.py"
      - "run.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "MonitorDeNoticias.spec"
      - ".github/workflows/build-portable.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: portable-release-main
  cancel-in-progress: true

env:
  PORTABLE_NAME: MonitorDeNoticias-Windows-Portable-x64.zip
  ARTIFACT_NAME: monitor-portable-release
  PLANILHAS_RUNTIME_TAG: planilhas-runtime-v1.0.4
  PLANILHAS_RUNTIME_ASSET: AutomacaoPlanilhas-Windows-Portable-v1.0.4.exe

jobs:
  build:
    name: Gerar portable
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            pyproject.toml

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

          python -m pip install `
            --upgrade `
            --only-binary=:all: `
            "PyAudioWPatch==0.2.12.8"

      - name: Validar backend WASAPI do Gravador de Tela
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -c "import pyaudiowpatch; import _portaudiowpatch; print('PyAudioWPatch OK:', pyaudiowpatch.__file__)"
          python -m pip show PyAudioWPatch

      - name: Gerar helper de login Globoplay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python tools/build-globoplay-login-helper.py

          $helper = "resources/globoplay-login-helper/GloboplayLoginHelper.exe"

          if (-not (Test-Path $helper)) {
            throw "GloboplayLoginHelper.exe não foi gerado."
          }

          $helperSize = (Get-Item $helper).Length

          if ($helperSize -lt 20MB) {
            throw "GloboplayLoginHelper.exe parece incompleto: $helperSize bytes."
          }

          Write-Host "Helper Globoplay gerado: $helper"
          Write-Host "Tamanho: $([math]::Round($helperSize / 1MB, 2)) MB"

          & $helper --help

          if ($LASTEXITCODE -ne 0) {
            throw "GloboplayLoginHelper.exe não executou o teste --help."
          }

      - name: Gerar Extrator de Notícias Electron
        shell: pwsh
        run: |
          Push-Location "tools/news_extractor"

          try {
            npm install --no-audit --no-fund
            npm run dist

            $exe = Get-ChildItem `
              "dist" `
              -Filter "ExtratorMateriasPortable-V1.25.19.exe" `
              -Recurse |
              Select-Object -First 1

            if (-not $exe) {
              throw "ExtratorMateriasPortable-V1.25.19.exe não foi gerado."
            }

            Write-Host "Extrator gerado: $($exe.FullName)"
          }
          finally {
            Pop-Location
          }

      - name: Gerar aplicativo com PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m PyInstaller --noconfirm --clean MonitorDeNoticias.spec

          if (-not (Test-Path "dist/MonitorDeNoticias/MonitorDeNoticias.exe")) {
            throw "MonitorDeNoticias.exe não foi gerado."
          }

          $audioBackend = Get-ChildItem `
            "dist/MonitorDeNoticias" `
            -Recurse `
            -File |
            Where-Object {
              $_.Name.ToLowerInvariant() -like "_portaudiowpatch*.pyd"
            } |
            Select-Object -First 1

          if (-not $audioBackend) {
            throw "_portaudiowpatch.pyd não entrou no portable."
          }

          Write-Host "Backend WASAPI incluído: $($audioBackend.FullName)"

      - name: Preparar estrutura portable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $root = Resolve-Path "dist/MonitorDeNoticias"

          foreach ($dir in @(
            "resources",
            "bin",
            "data",
            "logs",
            "temp",
            "Videos",
            "VideoEditorExports",
            "tools/news_extractor",
            "tools/spreadsheet_automation"
          )) {
            New-Item -ItemType Directory -Force -Path (Join-Path $root $dir) | Out-Null
          }

          if (Test-Path "resources") {
            Copy-Item "resources/*" (Join-Path $root "resources") -Recurse -Force
          }

          $helperSource = "resources/globoplay-login-helper/GloboplayLoginHelper.exe"
          $helperTargetDir = Join-Path $root "resources/globoplay-login-helper"
          $helperTarget = Join-Path $helperTargetDir "GloboplayLoginHelper.exe"

          if (-not (Test-Path $helperSource)) {
            throw "Fonte GloboplayLoginHelper.exe ausente após o build."
          }

          New-Item -ItemType Directory -Force -Path $helperTargetDir | Out-Null

          Copy-Item $helperSource $helperTarget -Force

          if (-not (Test-Path $helperTarget)) {
            throw "GloboplayLoginHelper.exe não foi copiado para o portable."
          }

          if ((Get-Item $helperTarget).Length -lt 20MB) {
            throw "GloboplayLoginHelper.exe copiado para o portable está incompleto."
          }

          $extractor = Get-ChildItem `
            "tools/news_extractor/dist" `
            -Filter "ExtratorMateriasPortable-V1.25.19.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $extractor) {
            throw "Executável do Extrator de Notícias não encontrado."
          }

          Copy-Item `
            $extractor.FullName `
            (Join-Path $root "tools/news_extractor/ExtratorMateriasPortable-V1.25.19.exe") `
            -Force

          $sheetTargetDir = Join-Path $root "tools/spreadsheet_automation"
          $sheetTarget = Join-Path $sheetTargetDir $env:PLANILHAS_RUNTIME_ASSET
          $sheetConfig = "tools/spreadsheet_automation/config.json"

          if (-not (Test-Path $sheetConfig)) {
            throw "config.json da Automação de Planilhas não foi encontrado no repositório."
          }

          gh release download `
            $env:PLANILHAS_RUNTIME_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $env:PLANILHAS_RUNTIME_ASSET `
            --dir $sheetTargetDir `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao baixar o runtime da Automação de Planilhas."
          }

          if (-not (Test-Path $sheetTarget)) {
            throw "Runtime da Automação de Planilhas não foi baixado."
          }

          if ((Get-Item $sheetTarget).Length -lt 50MB) {
            throw "Runtime da Automação de Planilhas parece incompleto."
          }

          Copy-Item `
            $sheetConfig `
            (Join-Path $sheetTargetDir "config.json") `
            -Force

          if (Test-Path "portable/README_PORTABLE.txt") {
            Copy-Item "portable/README_PORTABLE.txt" $root -Force
          }

          if (Test-Path "portable/THIRD_PARTY_NOTICES.txt") {
            Copy-Item "portable/THIRD_PARTY_NOTICES.txt" $root -Force
          }

      - name: Baixar yt-dlp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = Resolve-Path "dist/MonitorDeNoticias/bin"

          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile (Join-Path $bin "yt-dlp.exe") `
            -TimeoutSec 180

          & (Join-Path $bin "yt-dlp.exe") --version

      - name: Baixar Deno para suporte completo ao YouTube
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = Resolve-Path "dist/MonitorDeNoticias/bin"
          $tmpZip = Join-Path $env:RUNNER_TEMP "deno-x86_64-pc-windows-msvc.zip"
          $tmpDir = Join-Path $env:RUNNER_TEMP "deno-extracted"

          if (Test-Path $tmpZip) {
            Remove-Item $tmpZip -Force
          }

          if (Test-Path $tmpDir) {
            Remove-Item $tmpDir -Recurse -Force
          }

          Invoke-WebRequest `
            -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" `
            -OutFile $tmpZip `
            -TimeoutSec 300 `
            -MaximumRedirection 10

          if (-not (Test-Path $tmpZip)) {
            throw "Pacote do Deno não foi baixado."
          }

          Expand-Archive -Path $tmpZip -DestinationPath $tmpDir -Force

          $deno = Get-ChildItem $tmpDir -Filter "deno.exe" -Recurse |
            Select-Object -First 1

          if (-not $deno) {
            throw "deno.exe não foi encontrado após a extração."
          }

          Copy-Item $deno.FullName (Join-Path $bin "deno.exe") -Force

          $denoTarget = Join-Path $bin "deno.exe"

          if (-not (Test-Path $denoTarget)) {
            throw "deno.exe não foi copiado para bin."
          }

          & $denoTarget --version

      - name: Baixar FFmpeg e FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tmpZip = Join-Path $env:RUNNER_TEMP "ffmpeg-download.zip"
          $tmpDir = Join-Path $env:RUNNER_TEMP "ffmpeg-extracted"

          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )

          $ok = $false

          foreach ($url in $urls) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                if (Test-Path $tmpZip) {
                  Remove-Item $tmpZip -Force
                }

                Invoke-WebRequest `
                  -Uri $url `
                  -OutFile $tmpZip `
                  -TimeoutSec 300 `
                  -MaximumRedirection 10

                if ((Get-Item $tmpZip).Length -gt 10000000) {
                  $ok = $true
                  break
                }
              }
              catch {
                Write-Warning $_.Exception.Message

                if ($attempt -lt 3) {
                  Start-Sleep -Seconds (10 * $attempt)
                }
              }
            }

            if ($ok) {
              break
            }
          }

          if (-not $ok) {
            throw "Não foi possível baixar FFmpeg."
          }

          Expand-Archive $tmpZip $tmpDir -Force

          $ffmpeg = Get-ChildItem $tmpDir -Filter "ffmpeg.exe" -Recurse |
            Select-Object -First 1

          $ffprobe = Get-ChildItem $tmpDir -Filter "ffprobe.exe" -Recurse |
            Select-Object -First 1

          if (-not $ffmpeg -or -not $ffprobe) {
            throw "FFmpeg/FFprobe não encontrados."
          }

          Copy-Item $ffmpeg.FullName "dist/MonitorDeNoticias/bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "dist/MonitorDeNoticias/bin/ffprobe.exe" -Force

      - name: Criar ZIP portable rápido
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Join-Path $PWD $env:PORTABLE_NAME

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"

          if (Test-Path $sevenZip) {
            Push-Location "dist/MonitorDeNoticias"

            try {
              & $sevenZip a -tzip $zip ".\*" -mx=3 -mmt=on

              if ($LASTEXITCODE -ne 0) {
                throw "7-Zip retornou código $LASTEXITCODE"
              }
            }
            finally {
              Pop-Location
            }
          }
          else {
            Compress-Archive `
              -Path "dist/MonitorDeNoticias/*" `
              -DestinationPath $zip `
              -CompressionLevel Fastest
          }

          if (-not (Test-Path $zip)) {
            throw "ZIP portable não foi gerado."
          }

      - name: Validar estrutura do ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zipPath = (Resolve-Path $env:PORTABLE_NAME).Path
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {
            $exe = $archive.Entries |
              Where-Object {
                $_.FullName.Replace("\", "/") -ieq "MonitorDeNoticias.exe"
              } |
              Select-Object -First 1

            if (-not $exe) {
              throw "MonitorDeNoticias.exe não está na raiz do ZIP."
            }

            $audioBackend = $archive.Entries |
              Where-Object {
                $_.Name.ToLowerInvariant() -like "_portaudiowpatch*.pyd"
              } |
              Select-Object -First 1

            if (-not $audioBackend) {
              throw "Backend WASAPI (_portaudiowpatch.pyd) não está no ZIP final."
            }

            $deno = $archive.Entries |
              Where-Object {
                $_.FullName.Replace("\", "/") -ieq "bin/deno.exe"
              } |
              Select-Object -First 1

            if (-not $deno) {
              throw "Deno não está no ZIP final."
            }

            $ytdlp = $archive.Entries |
              Where-Object {
                $_.FullName.Replace("\", "/") -ieq "bin/yt-dlp.exe"
              } |
              Select-Object -First 1

            if (-not $ytdlp) {
              throw "yt-dlp.exe não está no ZIP final."
            }

            $globoplayHelper = $archive.Entries |
              Where-Object {
                $_.FullName.Replace("\", "/") -ieq `
                  "resources/globoplay-login-helper/GloboplayLoginHelper.exe"
              } |
              Select-Object -First 1

            if (-not $globoplayHelper) {
              throw "GloboplayLoginHelper.exe não está no ZIP final."
            }

            if ($globoplayHelper.Length -lt 20MB) {
              throw "GloboplayLoginHelper.exe no ZIP parece incompleto."
            }

            $newsExtractor = $archive.Entries |
              Where-Object {
                $_.FullName.Replace("\", "/") -ieq `
                  "tools/news_extractor/ExtratorMateriasPortable-V1.25.19.exe"
              } |
              Select-Object -First 1

            if (-not $newsExtractor) {
              throw "Extrator de Notícias não está dentro do portable."
            }

            $sheetExe = $archive.Entries |
              Where-Object {
                $_.FullName.Replace("\", "/") -ieq `
                  "tools/spreadsheet_automation/AutomacaoPlanilhas-Windows-Portable-v1.0.4.exe"
              } |
              Select-Object -First 1

            $sheetConfig = $archive.Entries |
              Where-Object {
                $_.FullName.Replace("\", "/") -ieq `
                  "tools/spreadsheet_automation/config.json"
              } |
              Select-Object -First 1

            if (-not $sheetExe -or -not $sheetConfig) {
              throw "Automação de Planilhas standalone v1.0.4 não está completa dentro do portable."
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Guardar ZIP para o job de Release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PORTABLE_NAME }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publicar Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar o ZIP gerado
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-files

      - name: Definir tag da Release
        shell: bash
        run: |
          echo "RELEASE_TAG=portable-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Central Inteligente de Mídia Portable - Build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Criar Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --generate-notes \
            --latest

      - name: Publicar ZIP via API de assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FILE="release-files/${PORTABLE_NAME}"

          if [ ! -f "$FILE" ]; then
            echo "Arquivo não encontrado: $FILE"
            exit 1
          fi

          UPLOAD_URL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.upload_url')"
          UPLOAD_URL="${UPLOAD_URL%%\{*}"
          ASSET_URL="${UPLOAD_URL}?name=${PORTABLE_NAME}"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 30 \
            --max-time 3600 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/zip" \
            --data-binary "@${FILE}" \
            "${ASSET_URL}" \
            -o upload-response.json

          echo "Upload concluído."
