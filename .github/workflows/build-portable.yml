name: Build e Release Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "resources/**"
      - "portable/**"
      - "tools/news_extractor/**"
      - "tools/spreadsheet_automation/**"
      - "run.py"
      - "requirements*.txt"
      - "MonitorDeNoticias.spec"
      - ".github/workflows/build-portable.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: portable-release-main
  cancel-in-progress: true

env:
  PORTABLE_NAME: MonitorDeNoticias-Windows-Portable-x64.zip
  ARTIFACT_NAME: monitor-portable-release

jobs:
  build:
    name: Gerar portable
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências Python
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Preparar motor da Automação de Planilhas
        shell: pwsh
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          Push-Location "tools/spreadsheet_automation"
          try {
            npm install --omit=dev --no-audit --no-fund
            node --check "engine/index.js"
          }
          finally {
            Pop-Location
          }

      - name: Gerar Extrator de Notícias Electron
        shell: pwsh
        run: |
          Push-Location "tools/news_extractor"
          try {
            npm install --no-audit --no-fund
            npm run dist

            $exe = Get-ChildItem "dist" -Filter "ExtratorMateriasPortable-V1.25.19.exe" -Recurse | Select-Object -First 1
            if (-not $exe) {
              throw "ExtratorMateriasPortable-V1.25.19.exe não foi gerado."
            }

            Write-Host "Extrator gerado: $($exe.FullName)"
          }
          finally {
            Pop-Location
          }

      - name: Gerar aplicativo com PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean MonitorDeNoticias.spec
          if (-not (Test-Path "dist/MonitorDeNoticias/MonitorDeNoticias.exe")) {
            throw "MonitorDeNoticias.exe não foi gerado."
          }

      - name: Preparar estrutura portable
        shell: pwsh
        run: |
          $root = Resolve-Path "dist/MonitorDeNoticias"

          foreach ($dir in @(
            "resources",
            "bin",
            "data",
            "logs",
            "temp",
            "Videos",
            "VideoEditorExports",
            "tools/news_extractor",
            "tools/spreadsheet_automation/engine",
            "tools/spreadsheet_automation/node_modules"
          )) {
            New-Item -ItemType Directory -Force -Path (Join-Path $root $dir) | Out-Null
          }

          if (Test-Path "resources") {
            Copy-Item "resources/*" (Join-Path $root "resources") -Recurse -Force
          }

          $extractor = Get-ChildItem `
            "tools/news_extractor/dist" `
            -Filter "ExtratorMateriasPortable-V1.25.19.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $extractor) {
            throw "Executável do Extrator de Notícias não encontrado."
          }

          Copy-Item `
            $extractor.FullName `
            (Join-Path $root "tools/news_extractor/ExtratorMateriasPortable-V1.25.19.exe") `
            -Force

          # Automação de Planilhas: a interface Electron antiga NÃO é copiada.
          # Somente o motor Node fica invisível dentro do Central.
          Copy-Item `
            "tools/spreadsheet_automation/engine/index.js" `
            (Join-Path $root "tools/spreadsheet_automation/engine/index.js") `
            -Force

          Copy-Item `
            "tools/spreadsheet_automation/package.json" `
            (Join-Path $root "tools/spreadsheet_automation/package.json") `
            -Force

          Copy-Item `
            "tools/spreadsheet_automation/config.default.json" `
            (Join-Path $root "tools/spreadsheet_automation/config.default.json") `
            -Force

          Copy-Item `
            "tools/spreadsheet_automation/node_modules/*" `
            (Join-Path $root "tools/spreadsheet_automation/node_modules") `
            -Recurse -Force

          $node = (Get-Command node -ErrorAction Stop).Source
          if (-not (Test-Path $node)) {
            throw "node.exe do runner não foi encontrado."
          }
          Copy-Item `
            $node `
            (Join-Path $root "tools/spreadsheet_automation/node.exe") `
            -Force

          if (Test-Path "portable/README_PORTABLE.txt") {
            Copy-Item "portable/README_PORTABLE.txt" $root -Force
          }

          if (Test-Path "portable/THIRD_PARTY_NOTICES.txt") {
            Copy-Item "portable/THIRD_PARTY_NOTICES.txt" $root -Force
          }

      - name: Baixar yt-dlp
        shell: pwsh
        run: |
          $bin = Resolve-Path "dist/MonitorDeNoticias/bin"
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile (Join-Path $bin "yt-dlp.exe") `
            -TimeoutSec 180

      - name: Baixar FFmpeg e FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tmpZip = Join-Path $env:RUNNER_TEMP "ffmpeg-download.zip"
          $tmpDir = Join-Path $env:RUNNER_TEMP "ffmpeg-extracted"

          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )

          $ok = $false

          foreach ($url in $urls) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                if (Test-Path $tmpZip) {
                  Remove-Item $tmpZip -Force
                }

                Invoke-WebRequest `
                  -Uri $url `
                  -OutFile $tmpZip `
                  -TimeoutSec 300 `
                  -MaximumRedirection 10

                if ((Get-Item $tmpZip).Length -gt 10000000) {
                  $ok = $true
                  break
                }
              }
              catch {
                Write-Warning $_.Exception.Message

                if ($attempt -lt 3) {
                  Start-Sleep -Seconds (10 * $attempt)
                }
              }
            }

            if ($ok) {
              break
            }
          }

          if (-not $ok) {
            throw "Não foi possível baixar FFmpeg."
          }

          Expand-Archive $tmpZip $tmpDir -Force

          $ffmpeg = Get-ChildItem $tmpDir -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $tmpDir -Filter "ffprobe.exe" -Recurse | Select-Object -First 1

          if (-not $ffmpeg -or -not $ffprobe) {
            throw "FFmpeg/FFprobe não encontrados."
          }

          Copy-Item $ffmpeg.FullName "dist/MonitorDeNoticias/bin/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "dist/MonitorDeNoticias/bin/ffprobe.exe" -Force

      - name: Criar ZIP portable rápido
        shell: pwsh
        run: |
          $zip = Join-Path $PWD $env:PORTABLE_NAME

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"

          if (Test-Path $sevenZip) {
            Push-Location "dist/MonitorDeNoticias"

            try {
              & $sevenZip a -tzip $zip ".\*" -mx=3 -mmt=on

              if ($LASTEXITCODE -ne 0) {
                throw "7-Zip retornou código $LASTEXITCODE"
              }
            }
            finally {
              Pop-Location
            }
          }
          else {
            Compress-Archive `
              -Path "dist/MonitorDeNoticias/*" `
              -DestinationPath $zip `
              -CompressionLevel Fastest
          }

          if (-not (Test-Path $zip)) {
            throw "ZIP portable não foi gerado."
          }

          $sizeMB = [math]::Round((Get-Item $zip).Length / 1MB, 2)
          Write-Host "Arquivo final: $zip"
          Write-Host "Tamanho final: $sizeMB MB"

      - name: Validar estrutura do ZIP
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zipPath = (Resolve-Path $env:PORTABLE_NAME).Path
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {
            $allowedInternalZips = @("_internal/base_library.zip")

            $zipEntries = $archive.Entries |
              Where-Object { $_.FullName.ToLowerInvariant().EndsWith(".zip") }

            $suspicious = $zipEntries |
              Where-Object {
                $normalized = $_.FullName.Replace("\", "/").ToLowerInvariant()
                $allowed = $allowedInternalZips -contains $normalized
                $portableInside = (
                  $normalized -like "*monitordenoticias-windows-portable*.zip" -or
                  $normalized -like "*monitor-de-noticias*portable*.zip"
                )
                $rootZip = -not $normalized.Contains("/")

                (-not $allowed) -and ($portableInside -or $rootZip)
              }

            if ($suspicious) {
              $names = (
                $suspicious |
                ForEach-Object { $_.FullName }
              ) -join ", "

              throw "ZIP aninhado indevido: $names"
            }

            $exe = $archive.Entries |
              Where-Object {
                $_.FullName.Replace("\", "/") -ieq "MonitorDeNoticias.exe"
              } |
              Select-Object -First 1

            if (-not $exe) {
              throw "MonitorDeNoticias.exe não está na raiz do ZIP."
            }

            $newsExtractor = $archive.Entries |
              Where-Object {
                $_.FullName.Replace("\", "/") -ieq `
                  "tools/news_extractor/ExtratorMateriasPortable-V1.25.19.exe"
              } |
              Select-Object -First 1

            if (-not $newsExtractor) {
              throw "Extrator de Notícias não está dentro do portable."
            }

            $sheetEngine = $archive.Entries |
              Where-Object {
                $_.FullName.Replace("\", "/") -ieq `
                  "tools/spreadsheet_automation/engine/index.js"
              } |
              Select-Object -First 1

            $sheetNode = $archive.Entries |
              Where-Object {
                $_.FullName.Replace("\", "/") -ieq `
                  "tools/spreadsheet_automation/node.exe"
              } |
              Select-Object -First 1

            if (-not $sheetEngine -or -not $sheetNode) {
              throw "Automação de Planilhas não está completa dentro do portable."
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Guardar ZIP para o job de Release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PORTABLE_NAME }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publicar Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar o ZIP gerado
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-files

      - name: Definir tag da Release
        shell: bash
        run: |
          echo "RELEASE_TAG=portable-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Central Inteligente de Mídia Portable - Build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Criar Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --generate-notes \
            --latest

      - name: Publicar ZIP via API de assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FILE="release-files/${PORTABLE_NAME}"

          if [ ! -f "$FILE" ]; then
            echo "Arquivo não encontrado: $FILE"
            exit 1
          fi

          echo "Arquivo que será enviado:"
          ls -lh "$FILE"

          UPLOAD_URL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.upload_url')"
          UPLOAD_URL="${UPLOAD_URL%%\{*}"
          ASSET_URL="${UPLOAD_URL}?name=${PORTABLE_NAME}"

          echo "Enviando diretamente para uploads.github.com..."

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 30 \
            --max-time 3600 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/zip" \
            --data-binary "@${FILE}" \
            "${ASSET_URL}" \
            -o upload-response.json

          echo "Upload concluído."

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[] | [.name, .size, .state] | @tsv'
