name: Build e Release Ubuntu Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "resources/**"
      - "portable/linux/**"
      - "tools/news_extractor/**"
      - "tools/globoplay-login-helper.py"
      - "tools/build-globoplay-login-helper.py"
      - "scripts/pyi_runtime_linux_validation.py"
      - "scripts/validate_linux_bundle.py"
      - "run.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "MonitorDeNoticias-Linux.spec"
      - ".github/workflows/build-ubuntu.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: ubuntu-portable-release-main
  cancel-in-progress: true

env:
  PORTABLE_DIR: Central-Inteligente-de-Midia-Ubuntu-Portable-x86_64
  PORTABLE_ARCHIVE: Central-Inteligente-de-Midia-Ubuntu-Portable-x86_64.tar.gz
  ARTIFACT_NAME: central-ubuntu-portable

jobs:
  build:
    name: Gerar Ubuntu Portable
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            pyproject.toml

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar bibliotecas de build e teste
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            file \
            xz-utils \
            unzip \
            patchelf \
            xvfb \
            xauth \
            libgl1 \
            libegl1 \
            libdbus-1-3 \
            libnss3 \
            libnspr4 \
            libasound2 \
            libpulse0 \
            pulseaudio-utils \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-randr0 \
            libxcb-xfixes0 \
            libx11-6 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxtst6 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libcups2

      - name: Instalar dependências Python
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            -r requirements.txt \
            -r requirements-build.txt

      - name: Validar dependências Python Linux
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import keyring
          import secretstorage
          import PySide6
          from PySide6 import QtWebEngineCore

          print("PySide6:", PySide6.__version__)
          print("keyring:", keyring.__file__)
          print("secretstorage:", secretstorage.__file__)
          print("QtWebEngineCore:", QtWebEngineCore.__file__)
          PY

      - name: Gerar helper Globoplay Linux
        shell: bash
        run: |
          set -euo pipefail

          python tools/build-globoplay-login-helper.py

          HELPER="resources/globoplay-login-helper/GloboplayLoginHelper"

          test -f "$HELPER"
          chmod +x "$HELPER"

          SIZE="$(stat -c%s "$HELPER")"

          if [ "$SIZE" -lt 20000000 ]; then
            echo "Helper Globoplay parece incompleto: ${SIZE} bytes"
            exit 1
          fi

      - name: Gerar runtime Linux do Extrator de Matérias
        shell: bash
        run: |
          set -euo pipefail

          pushd tools/news_extractor
          npm install --no-audit --no-fund
          npm run dist:linux
          popd

          RUNTIME="tools/news_extractor/dist/linux-unpacked"

          if [ ! -d "$RUNTIME" ]; then
            echo "linux-unpacked não foi gerado."
            exit 1
          fi

          ENGINE="$(
            find "$RUNTIME" \
              -maxdepth 1 \
              -type f \
              -perm -u+x \
              -printf '%s %p\n' |
            sort -nr |
            head -n 1 |
            cut -d' ' -f2-
          )"

          if [ -z "$ENGINE" ] || [ ! -f "$ENGINE" ]; then
            echo "Executável principal Electron não localizado."
            exit 1
          fi

          echo "NEWS_ENGINE=$(basename "$ENGINE")" >> "$GITHUB_ENV"

          echo "Motor Electron Linux:"
          echo "$ENGINE"

      - name: Gerar Central Linux com PyInstaller
        shell: bash
        run: |
          set -euo pipefail

          python -m PyInstaller \
            --noconfirm \
            --clean \
            MonitorDeNoticias-Linux.spec

          ROOT="dist/CentralInteligenteDeMidia"

          test -x "$ROOT/CentralInteligenteDeMidia"

      - name: Preparar bundle da Central
        shell: bash
        run: |
          set -euo pipefail

          ROOT="dist/CentralInteligenteDeMidia"

          mkdir -p \
            "$ROOT/resources" \
            "$ROOT/bin" \
            "$ROOT/tools/news_extractor" \
            "$ROOT/data" \
            "$ROOT/logs" \
            "$ROOT/temp" \
            "$ROOT/Videos" \
            "$ROOT/VideoEditorExports"

          if [ -d resources ]; then
            cp -a resources/. "$ROOT/resources/"
          fi

          chmod +x \
            "$ROOT/resources/globoplay-login-helper/GloboplayLoginHelper"

          cp -a \
            tools/news_extractor/dist/linux-unpacked \
            "$ROOT/tools/news_extractor/runtime"

          cat > \
            "$ROOT/tools/news_extractor/ExtratorMateriasPortable-V1.25.19" \
            <<EOF
          #!/bin/sh
          set -eu
          HERE="\$(CDPATH= cd -- "\$(dirname -- "\$0")" && pwd)"
          exec "\$HERE/runtime/${NEWS_ENGINE}" "\$@"
          EOF

          chmod +x \
            "$ROOT/tools/news_extractor/ExtratorMateriasPortable-V1.25.19"

      - name: Baixar yt-dlp Linux standalone
        shell: bash
        run: |
          set -euo pipefail

          ROOT="dist/CentralInteligenteDeMidia"

          curl \
            --fail \
            --location \
            --retry 4 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 300 \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux" \
            -o "$ROOT/bin/yt-dlp"

          chmod +x "$ROOT/bin/yt-dlp"

          cp \
            "$ROOT/bin/yt-dlp" \
            "$ROOT/bin/yt-dlp-stable"

          chmod +x "$ROOT/bin/yt-dlp-stable"

          "$ROOT/bin/yt-dlp" --version

      - name: Baixar Deno Linux
        shell: bash
        run: |
          set -euo pipefail

          ROOT="dist/CentralInteligenteDeMidia"
          TMP_DIR="${RUNNER_TEMP}/deno-linux"
          ZIP="${RUNNER_TEMP}/deno-linux.zip"

          rm -rf "$TMP_DIR" "$ZIP"
          mkdir -p "$TMP_DIR"

          curl \
            --fail \
            --location \
            --retry 4 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 300 \
            "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip" \
            -o "$ZIP"

          unzip -q "$ZIP" -d "$TMP_DIR"

          test -f "$TMP_DIR/deno"

          cp \
            "$TMP_DIR/deno" \
            "$ROOT/bin/deno"

          chmod +x "$ROOT/bin/deno"

          "$ROOT/bin/deno" --version

      - name: Baixar FFmpeg e FFprobe Linux estáticos
        shell: bash
        run: |
          set -euo pipefail

          ROOT="dist/CentralInteligenteDeMidia"
          ARCHIVE="${RUNNER_TEMP}/ffmpeg-static.tar.xz"
          EXTRACTED="${RUNNER_TEMP}/ffmpeg-static"

          FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"

          rm -rf "$ARCHIVE" "$EXTRACTED"
          mkdir -p "$EXTRACTED"

          echo "Baixando FFmpeg Linux x86_64:"
          echo "$FFMPEG_URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            "$FFMPEG_URL" \
            -o "$ARCHIVE"

          test -f "$ARCHIVE"

          SIZE="$(stat -c%s "$ARCHIVE")"

          echo "Arquivo recebido: ${SIZE} bytes"
          file "$ARCHIVE"

          # O pacote real do BtbN possui mais de 100 MB.
          # Se vier HTML/página de erro, normalmente terá apenas alguns KB.
          if [ "$SIZE" -lt 50000000 ]; then
            echo "Download do FFmpeg incompleto ou inválido: ${SIZE} bytes"
            echo "Esperado: arquivo XZ com pelo menos 50 MB."
            exit 1
          fi

          # Valida a integridade XZ ANTES de chamar tar.
          # Isso evita o erro obscuro:
          #   xz: File format not recognized
          #   tar: Child returned status 1
          xz -t "$ARCHIVE"

          tar -xJf "$ARCHIVE" -C "$EXTRACTED"

          FFMPEG="$(
            find "$EXTRACTED" \
              -type f \
              -name ffmpeg |
            head -n 1
          )"

          FFPROBE="$(
            find "$EXTRACTED" \
              -type f \
              -name ffprobe |
            head -n 1
          )"

          if [ -z "$FFMPEG" ] || [ ! -f "$FFMPEG" ]; then
            echo "ffmpeg não foi localizado no pacote extraído."
            exit 1
          fi

          if [ -z "$FFPROBE" ] || [ ! -f "$FFPROBE" ]; then
            echo "ffprobe não foi localizado no pacote extraído."
            exit 1
          fi

          cp "$FFMPEG" "$ROOT/bin/ffmpeg"
          cp "$FFPROBE" "$ROOT/bin/ffprobe"

          chmod +x \
            "$ROOT/bin/ffmpeg" \
            "$ROOT/bin/ffprobe"

          echo "Validando executáveis copiados:"
          "$ROOT/bin/ffmpeg" -version | head -n 1
          "$ROOT/bin/ffprobe" -version | head -n 1

      - name: Validar bundle antes de empacotar
        shell: bash
        run: |
          set -euo pipefail

          ROOT="dist/CentralInteligenteDeMidia"

          python \
            scripts/validate_linux_bundle.py \
            "$ROOT"

          if ldd "$ROOT/CentralInteligenteDeMidia" 2>/dev/null |
             grep -q "not found"; then
            echo "Há biblioteca dinâmica ausente no executável principal."
            ldd "$ROOT/CentralInteligenteDeMidia" || true
            exit 1
          fi

      - name: Montar pasta Ubuntu Portable
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="dist/CentralInteligenteDeMidia"
          TARGET="dist/${PORTABLE_DIR}"

          rm -rf "$TARGET"
          mkdir -p "$TARGET"

          cp -a "$SOURCE/." "$TARGET/"

          cp \
            portable/linux/INICIAR-CENTRAL.sh \
            "$TARGET/INICIAR-CENTRAL.sh"

          cp \
            portable/linux/TESTAR-PORTABLE.sh \
            "$TARGET/TESTAR-PORTABLE.sh"

          cp \
            portable/linux/README-UBUNTU-PORTABLE.txt \
            "$TARGET/README-UBUNTU-PORTABLE.txt"

          chmod +x \
            "$TARGET/INICIAR-CENTRAL.sh" \
            "$TARGET/TESTAR-PORTABLE.sh" \
            "$TARGET/CentralInteligenteDeMidia" \
            "$TARGET/bin/ffmpeg" \
            "$TARGET/bin/ffprobe" \
            "$TARGET/bin/yt-dlp" \
            "$TARGET/bin/yt-dlp-stable" \
            "$TARGET/bin/deno" \
            "$TARGET/resources/globoplay-login-helper/GloboplayLoginHelper" \
            "$TARGET/tools/news_extractor/ExtratorMateriasPortable-V1.25.19"

          echo "Conteúdo da raiz portable:"
          ls -lah "$TARGET"

      - name: Smoke test dos imports no portable
        shell: bash
        run: |
          set -euo pipefail

          TARGET="dist/${PORTABLE_DIR}"
          RESULT="${RUNNER_TEMP}/central-linux-smoke.json"

          CENTRAL_LINUX_SMOKE=1 \
          CENTRAL_LINUX_SMOKE_OUTPUT="$RESULT" \
            "$TARGET/CentralInteligenteDeMidia"

          cat "$RESULT"

      - name: Boot real da interface em X11 virtual
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$PWD/dist/${PORTABLE_DIR}"

          mkdir -p \
            "${RUNNER_TEMP}/central-home" \
            "${RUNNER_TEMP}/central-xdg"

          chmod 700 \
            "${RUNNER_TEMP}/central-xdg"

          set +e

          timeout \
            --signal=TERM \
            --kill-after=5s \
            18s \
            xvfb-run \
              -a \
              -s "-screen 0 1920x1080x24" \
              env \
                HOME="${RUNNER_TEMP}/central-home" \
                XDG_RUNTIME_DIR="${RUNNER_TEMP}/central-xdg" \
                XDG_SESSION_TYPE=x11 \
                "$TARGET/INICIAR-CENTRAL.sh"

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 124 ]; then
            echo
            echo "A Central encerrou durante o teste real."
            echo "Código: $STATUS"
            echo

            if [ -f "$TARGET/logs/inicializacao.log" ]; then
              cat "$TARGET/logs/inicializacao.log"
            fi

            exit 1
          fi

          echo "Boot real aprovado: interface permaneceu ativa por 18 segundos."

      - name: Gerar TAR.GZ portable
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            "$PORTABLE_ARCHIVE" \
            "${PORTABLE_ARCHIVE}.sha256"

          tar \
            -C dist \
            -czf "$PORTABLE_ARCHIVE" \
            "$PORTABLE_DIR"

          test -f "$PORTABLE_ARCHIVE"

          sha256sum \
            "$PORTABLE_ARCHIVE" \
            > "${PORTABLE_ARCHIVE}.sha256"

          ls -lh \
            "$PORTABLE_ARCHIVE" \
            "${PORTABLE_ARCHIVE}.sha256"

      - name: Validar arquivo compactado final
        shell: bash
        run: |
          set -euo pipefail

          TEST_ROOT="${RUNNER_TEMP}/portable-final-test"

          rm -rf "$TEST_ROOT"
          mkdir -p "$TEST_ROOT"

          tar \
            -xzf "$PORTABLE_ARCHIVE" \
            -C "$TEST_ROOT"

          TARGET="$TEST_ROOT/$PORTABLE_DIR"

          test -x "$TARGET/INICIAR-CENTRAL.sh"
          test -x "$TARGET/TESTAR-PORTABLE.sh"
          test -x "$TARGET/CentralInteligenteDeMidia"
          test -x "$TARGET/bin/ffmpeg"
          test -x "$TARGET/bin/yt-dlp"
          test -x "$TARGET/bin/deno"

          "$TARGET/TESTAR-PORTABLE.sh"

          RESULT="${RUNNER_TEMP}/archive-smoke.json"

          CENTRAL_LINUX_SMOKE=1 \
          CENTRAL_LINUX_SMOKE_OUTPUT="$RESULT" \
            "$TARGET/CentralInteligenteDeMidia"

          cat "$RESULT"

          echo "Portable extraído e validado com sucesso."

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-portable-diagnostics
          path: |
            dist/${{ env.PORTABLE_DIR }}/logs/
          if-no-files-found: ignore
          retention-days: 3

      - name: Guardar Ubuntu Portable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.PORTABLE_ARCHIVE }}
            ${{ env.PORTABLE_ARCHIVE }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  release:
    name: Publicar Release Ubuntu Portable
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Baixar Ubuntu Portable
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-files

      - name: Definir Release
        shell: bash
        run: |
          set -euo pipefail

          echo \
            "RELEASE_TAG=ubuntu-portable-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}" \
            >> "$GITHUB_ENV"

          echo \
            "RELEASE_NAME=Central Inteligente de Mídia Ubuntu Portable - Build ${GITHUB_RUN_NUMBER}" \
            >> "$GITHUB_ENV"

      - name: Criar Release e publicar portable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ARCHIVE="release-files/${PORTABLE_ARCHIVE}"
          SHA_FILE="${ARCHIVE}.sha256"

          test -f "$ARCHIVE"
          test -f "$SHA_FILE"

          gh release create \
            "$RELEASE_TAG" \
            "$ARCHIVE" \
            "$SHA_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --generate-notes

          echo
          echo "Release Ubuntu Portable publicada:"
          echo "$RELEASE_TAG"
